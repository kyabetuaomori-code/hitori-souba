name: Update JP Sector Data

on:
  schedule:
    # 07:00 UTC = 16:00 JST (after Tokyo market close)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch sector data
        run: python scripts/fetch_jp_sectors.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sectors_jp.json
          git diff --staged --quiet || git commit -m "Update JP sector data"
          git push
